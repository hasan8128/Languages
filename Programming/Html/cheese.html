<!DOCTYPE html>
<html>
    <head>
        <title text-transform: uppercase; text-decoration: underline>
            Student Form
        </title>
        <style>
            .main{font-size: 18px; font-weight: italic; margin-top: 60px ;}
            .box{font-size: 18px; font-weight: italic; text-align: center; margin-top: 60px ; margin-left: 250px}
            body{background: rgb(135, 118, 118); line-height: 4px}
            h1{color: black; text-align: center;}
            h2{color: rgb(45, 85, 103)  ; text-align: left;margin-top: 80px;}
        </style>
    </head>
    <body>
        <div class = "main">
            <h1> Student Registration Form</h1>
            <div class = "box">
                <form method="post">
            <h2>Student Name:</h2>
            <input type = "text" name = "name">
            <br>

            <h2>Email:</h2>
            <input type = "email" name = "email">
            <br>
            
            <h2>Mobile Number:</h2>
            <input type = "tel" name = "mobile">
            <br>

            <h2>Date of birth:</h2>
            <input type = "date" name = "dob">
            <br>

            <h2>Address:</h2>
            <input type = "text" name = "address">
            <br>

            <h2>Gender:</h2>
            <input type = "radio" name ="gender" value = "Male">Male
            <input type = "radio" name ="gender" value = "Female">Female
            <input type = "radio" name ="gender" value = "Other">Other
            <br>

            <h2>Hobbies:</h2>
            <input type = "checkbox" name = "hobbies" value="Reading">Reading
            <input type = "checkbox" name = "hobbies" value="Coding">Coding
            <input type = "checkbox" name = "hobbies" value="Sports">Sports
            <br>

            <h2>Profile Photo:</h2>
            <input type = "file" name = "photo">
            <input type = "submit" name = "submit">
            <input type = "reset" name = "reset">
            <br>
        </form>
            </div>
        </div>
    </body>
</html>
